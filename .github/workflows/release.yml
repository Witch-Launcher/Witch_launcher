name: Release build

permissions:
  contents: write
  actions: write

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: witch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse the development (beta) build instead of rebuilding from scratch.
  # Flow: download rolling `pre-release` assets -> verify -> re-publish to
  # rolling `release` with fresh stable notes + Discord notification.
  # This saves hours of MacStadium build time per push to main.
  # NOTE: promoted release is iOS-only (whatever beta built). If tvOS /
  # simulator builds are needed, run the legacy MacStadium workflow manually.
  promote:
    name: Promote beta build to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository (for version + changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Resolve version (auto from Info.plist + SHA + date)
        id: version
        shell: bash
        run: |
          bash scripts/ci/resolve_version.sh
          echo "--- resolved ---"
          grep -E '^(APP_VERSION|SHORT_SHA|BUILD_DATE|BUILD_TAG)=' "$GITHUB_OUTPUT" | tail -n 8 || true

      - name: Download pre-release assets (reuse development build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm -rf promoted && mkdir -p promoted
          echo "Downloading rolling pre-release assets..."
          gh release download pre-release -D ./promoted || {
            echo "::error::No pre-release found. Push to beta first so development.yml builds once."
            exit 1
          }
          echo "--- promoted tree ---"
          find promoted -maxdepth 4 -type f | head -n 50
          COUNT=$(find promoted -type f \( -name '*.ipa' -o -name '*.tipa' \) | wc -l | tr -d ' ')
          echo "Found $COUNT ipa/tipa files"
          if [ "$COUNT" = "0" ]; then
            echo "::error::pre-release exists but contains no .ipa/.tipa — check development run."
            exit 1
          fi
          # Record which commit the pre-release tag points at (for traceability)
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/pre-release" --jq '.object.sha' > promoted/.source_tag_sha.txt 2>/dev/null || echo "unknown" > promoted/.source_tag_sha.txt
          echo "pre-release tag sha: $(cat promoted/.source_tag_sha.txt)"
          # Warn (not fail) if pre-release commit is not an ancestor of main HEAD
          SRC=$(cat promoted/.source_tag_sha.txt)
          if git cat-file -e "$SRC" 2>/dev/null && [ "$SRC" != "unknown" ]; then
            if git merge-base --is-ancestor "$SRC" HEAD 2>/dev/null; then
              echo "Source check: pre-release commit IS ancestor of main HEAD — good."
            else
              echo "::warning::pre-release commit $SRC is NOT an ancestor of main HEAD. Promoting anyway (beta/main diverged) — verify manually."
            fi
          else
            echo "::warning::Could not resolve pre-release tag SHA locally (shallow clone). Skipping ancestor check."
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd promoted || exit 1
          shopt -s globstar nullglob
          FILES=(**/*.ipa **/*.tipa *.ipa *.tipa)
          if [ ${#FILES[@]} -eq 0 ]; then echo "::error::No ipa/tipa under promoted/"; exit 1; fi
          sha256sum "${FILES[@]}" | tee ../checksums.txt
          echo "--- checksums.txt ---"
          cat ../checksums.txt

      - name: "Generate release notes (verbose EN - what fixed + who fixed)"
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          python3 scripts/ci/gen_notes.py \
            --before "${{ github.event.before }}" \
            --sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --version "${{ steps.version.outputs.APP_VERSION }}" \
            --pusher "${{ github.event.pusher.name }}" \
            --runner "promote-from-pre-release" \
            --artifacts-dir ./promoted \
            --out RELEASE_NOTES.md
          {
            echo ""
            echo "> Promoted from rolling pre-release (reuse development build, no rebuild)."
            echo "> Source pre-release tag sha: $(cat promoted/.source_tag_sha.txt 2>/dev/null || echo unknown)"
          } >> RELEASE_NOTES.md
          head -n 60 RELEASE_NOTES.md

      - name: Reset rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete release --cleanup-tag -y 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/release" 2>/dev/null || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Witch v${{ steps.version.outputs.APP_VERSION }} — Release (stable)
          body_path: RELEASE_NOTES.md
          prerelease: false
          draft: false
          fail_on_unmatched_files: false
          files: |
            promoted/**/*.ipa
            promoted/**/*.tipa
            checksums.txt
            RELEASE_NOTES.md

      - name: Notify Discord (English, no mentions, verbose summary)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 scripts/ci/discord_notify.py \
            --branch "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "${{ github.sha }}" \
            --before "${{ github.event.before }}" \
            --pusher "${{ github.event.pusher.name }}" \
            --version "${{ steps.version.outputs.APP_VERSION }}" \
            --channel "release" \
            --status "${{ job.status }}" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/release" \
            --notes-file RELEASE_NOTES.md \
            --artifacts-dir ./promoted || true
