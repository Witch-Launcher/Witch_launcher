name: Release build

permissions:
  contents: write
  actions: write

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    name: Release build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
          - platform: 3
            platform_name: tvos
          - platform: 7
            platform_name: iossimulator
          - platform: 8
            platform_name: tvossimulator
    
    runs-on: MacStadium
    steps:
      - name: Remove work folders
        env:
          password: ${{ secrets.ELLIE_MINI_SECRET }}
        run: |
          echo "before"
          ls -lah ./
          echo $password | sudo -S rm -rf ./* || true
          echo $password | sudo -S rm -rf ./.??* || true
          echo "after"
          ls -lah ./
          
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        shell: bash
        run: |
          set -o pipefail
          # Same rationale as development.yml: skip the flaky ANGLE tree.
          SUBMODULES="Natives/external/NG-GL4ES/3rdparty/SPIRV-Cross Natives/external/NG-GL4ES/3rdparty/glslang"
          for i in 1 2 3 4 5 6; do
            echo "::group::Submodule update attempt $i/6"
            if git -c protocol.version=2 submodule sync -- $SUBMODULES && \
               git -c protocol.version=2 submodule update --init --force --depth=1 $SUBMODULES; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            for p in $SUBMODULES; do
              if [ -e "$p/.git" ] && ! git -C "$p" rev-parse --verify -q HEAD >/dev/null 2>&1; then
                rm -rf "$p"
                echo "Removed poisoned clone: $p"
              fi
            done
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java8
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false # use gl4es 1.1.5
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib
          
      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push
          
      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-ios-aarch64

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-ios-aarch64

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-ios-aarch64

      - name: Download JRE25
        run: |
          mkdir -p depends/java-25-openjdk
          curl -L --fail -o depends/jre25-ios-aarch64.zip \
            https://assets.angelauramc.dev/openjdk/ios-arm64/jre25-ios-aarch64.zip
          cd depends && unzip -o jre25-ios-aarch64.zip && rm -f jre25-ios-aarch64.zip
          cd depends && tar xf jre25-ios-arm64-*.tar.xz -C java-25-openjdk

      - name: Inject Witch private config (AES-256-GCM encrypted BuildKeys)
        env:
          WITCH_BASE_URL: ${{ secrets.WITCH_BASE_URL }}
          WITCH_HMAC_SECRET: ${{ secrets.WITCH_HMAC_SECRET }}
          WITCH_PROXY_TOKEN: ${{ secrets.WITCH_PROXY_TOKEN }}
          WITCH_CURSEFORGE_API_KEY: ${{ secrets.WITCH_CURSEFORGE_API_KEY }}
          WITCH_ENCRYPTION_KEY: ${{ secrets.WITCH_ENCRYPTION_KEY }}
        run: |
          mkdir -p Natives/Config
          # Mask encryption key so it never leaks in logs
          if [ -n "$WITCH_ENCRYPTION_KEY" ]; then
            echo "::add-mask::$WITCH_ENCRYPTION_KEY"
            echo "::add-mask::$WITCH_HMAC_SECRET"
            echo "::add-mask::$WITCH_PROXY_TOKEN"
            echo "::add-mask::$WITCH_BASE_URL"
          fi
          # Install cryptography for encrypt script (fast, cached via pip)
          python3 -m pip install --quiet --break-system-packages cryptography 2>&1 | tail -n 5 || pip3 install --quiet cryptography 2>&1 | tail -n 5 || true
          if [ -n "$WITCH_ENCRYPTION_KEY" ]; then
            echo "Injecting ENCRYPTED WitchConfig.h (SERVER-ONLY, no master key in IPA) — enc_v1:*** masked"
          else
            echo "No WITCH_ENCRYPTION_KEY — injecting PLAIN WitchConfig.h (public build)"
          fi
          # --server-only: master key stays ONLY on server, IPA holds only enc_v1, no WITCH_ENCRYPTION_KEY
          python3 scripts/encrypt_witch_config.py --server-only --out Natives/Config/WitchConfig.h
          echo "--- WitchConfig.h (masked) ---"
          # Never cat raw secrets — show only masked preview
          sed -E 's/enc_v1:[A-Za-z0-9+\/=]{20,}/enc_v1:***/g' Natives/Config/WitchConfig.h || cat Natives/Config/WitchConfig.h
          echo "--- end masked ---"

      - name: Build for ${{ matrix.platform_name }}
        env:
          password: ${{ secrets.ELLIE_MINI_SECRET }}
          JAVA_HOME: ${{ steps.setup-java8.outputs.path }}
          BOOTJDK: ${{ steps.setup-java8.outputs.path }}/bin
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export RUNNER=1
          # release artifacts are fetched as prebuilt JRE archives above; never rebuild from source here
          export JRE_BUILD_MODE=download
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Witch-${{ matrix.platform_name }}-ipa
          path: artifacts/Witch-*-${{ matrix.platform_name }}.ipa
          if-no-files-found: ignore

      - name: Upload regular tipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Witch-${{ matrix.platform_name }}-tipa
          path: artifacts/Witch-*-${{ matrix.platform_name }}-trollstore.tipa
          if-no-files-found: ignore

      - name: Upload Witch.dSYM
        if: matrix.platform_name == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: Witch-dSYM
          path: artifacts/Witch.dSYM
          if-no-files-found: ignore

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Reset rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete release --cleanup-tag -y 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/release" 2>/dev/null || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          name: Witch Launcher — Release
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            **/*.ipa
            **/*.tipa
