name: Development build

on:
  pull_request:
    types: [opened, reopened]
    branches: ['Amethyst-iOS-J25Exp', 'main']
  push:
    branches: ['Amethyst-iOS-J25Exp', 'main']
  workflow_dispatch:

jobs:
  build:
    name: Development build
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      # googlesource.com intermittently returns HTTP 502 / truncated
      # responses while resolving pinned commits during shallow submodule
      # fetches (fails on a random submodule each run). Retry until every
      # submodule is checked out; already-updated ones are skipped fast.
      - name: Checkout submodules (with retries)
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2 3 4 5 6; do
            echo "::group::Submodule update attempt $i/6"
            if git -c protocol.version=2 submodule sync --recursive && \
               git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # provision the stable zulu jdk 8 runtime environment as structured in the upstream core
      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '8'

      # boot JDKs for the from-source JRE builds (same-major as the target)
      - name: Setup boot JDK 17 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java17
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup boot JDK 21 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java21
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup boot JDK 25 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java25
        with:
          distribution: 'zulu'
          java-version: '25'

      # initialize essential building and packaging utilities via homebrew infrastructure
      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install make wget ldid autoconf pkg-config
          sudo mkdir -p /usr/local/bin
          # map the gmake binary symlink seamlessly across the target build runner paths
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake

      - name: Cache iOS JREs
        id: cache-jres
        uses: actions/cache@v5
        with:
          path: depends/
          key: amethyst-jres-v2

      # resolve and inject core environmental paths and flags directly into the global execution scope
      - name: Resolve env (paths, SDK)
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
          # setup-java's location is not guaranteed to be registered with
          # /usr/libexec/java_home on macOS runners. Persist it for every
          # Make invocation, including the earlier JRE-build step.
          echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> $GITHUB_ENV
          echo "BOOTJDK=${{ steps.setup-java.outputs.path }}/bin" >> $GITHUB_ENV
          echo "RUNNER=0" >> $GITHUB_ENV

      - name: Verify tools
        run: |
          gmake --version | head -1
          ldid -V 2>&1 | head -1 || true
          cmake --version | head -1
          wget --version | head -1
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDKPATH=$SDKPATH"

      # Build the four iOS JREs from source (skipped when restored from cache:
      # build.sh/make short-circuit on depends/java-<ver>-openjdk/release).
      # Signal-legacy: vtool signature warnings are filtered like the main step.
      - name: Build iOS JREs from source
        if: steps.cache-jres.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          export RUNNER=0
          export JRE_BUILD_MODE=build
          export JRE_BOOT_8="${{ steps.setup-java.outputs.path }}"
          export JRE_BOOT_17="${{ steps.setup-java17.outputs.path }}"
          export JRE_BOOT_21="${{ steps.setup-java21.outputs.path }}"
          export JRE_BOOT_25="${{ steps.setup-java25.outputs.path }}"
          gmake jre 2> >(grep -v "vtool warning: code signature will be invalid" >&2)

      # Trigger gmake compilation pipelines with inline stderr filtering and execute post-build binary optimization
      - name: Build sideload IPA & TrollStore tIPA
        shell: bash
        run: |
          JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
          export PATH="$JDK_BASE_PATH/bin:/opt/homebrew/bin:$PATH"
          export JAVA_HOME="$JDK_BASE_PATH"
          export BOOTJDK="$JDK_BASE_PATH/bin"
          export SLIMMED=1
          
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""

          export CFLAGS="-Wno-error=implicit-function-declaration $CFLAGS"
          export CXXFLAGS="-Wno-error=implicit-function-declaration $CXXFLAGS"

          SIGN_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= APP_ICON=AppIcon-Development"

          # WARNING MITIGATION: Filter runtime stderr streams to suppress repetitive upstream vtool signature warnings
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
          
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)

      - name: List artifacts
        if: always()
        run: ls -la artifacts/ || true

      - name: Upload TrollStore tIPA (full)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Witch-ios-trollstore
          path: artifacts/Witch-*-ios-trollstore.tipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload TrollStore tIPA (slimmed)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Witch-ios-trollstore-slimmed
          path: artifacts/Witch-slimmed-*-ios-trollstore.tipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (full)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Witch-ios
          path: artifacts/Witch-*-ios.ipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload regular IPA (slimmed)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Witch-ios-slimmed
          path: artifacts/Witch-slimmed-*-ios.ipa
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0

      - name: Upload Witch.dSYM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Witch.dSYM
          path: artifacts/Witch.dSYM
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0

      # extract local compilation cmake diagnostic records upon unexpected pipeline failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            Natives/build/CMakeFiles/CMakeOutput.log
            Natives/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
